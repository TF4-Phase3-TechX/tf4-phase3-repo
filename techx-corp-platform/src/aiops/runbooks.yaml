runbooks:
  - id: llm-timeout-escalation
    incident_type: llm_timeout_error
    automatic_action: null
    steps:
      - Confirm the error-rate window in Prometheus.
      - Correlate timeout/rate-limit logs and failed traces.
      - Verify provider configuration and application fallback behavior.
      - Escalate to the product-reviews and LLM owners.
  - id: product-reviews-config-rollback
    incident_type: service_latency_spike
    automatic_action: gitops_restore_managed_env
    preconditions:
      - The base-branch CDO policy authorizes only product-reviews/service_latency_spike and the three MANDATE22_REVIEW_DELAY_* entries.
      - The known-good Git SHA is a full ancestor of the current main branch.
      - No non-terminal durable saga or target Lease exists for product-reviews.
      - The CDO-owned GitOps App can open an idempotent incident branch and PR but cannot push main or bypass required checks.
      - Live autonomous mode uses a durable file saga backend; non-terminal saga V1 records block activation.
    verification:
      - Required checks validate the exact semantic YAML and rendered pod-template delta.
      - Argo CD self-heal rolls the merged Git identity to product-reviews.
      - The remediation annotation, managed env state, readiness and exact review-RPC telemetry match the saga expectation.
      - Three polls are healthy with sufficient request volume.
      - Failed verification opens at most one compensation PR and durably quarantines the still-active incident.
  - id: service-error-rate-escalation
    incident_type: service_error_rate_spike
    automatic_action: null
    steps:
      - Confirm the per-service error-rate and minimum request volume in Prometheus.
      - Correlate failed traces and scoped error logs for the same service and window.
      - Review recent deployments without assigning causality from timing alone.
      - Escalate to the owning service team with the evidence bundle.
  - id: service-availability-escalation
    incident_type: service_availability
    automatic_action: null
    steps:
      - Confirm desired, available, ready and updated Deployment replicas.
      - Inspect Pod and Deployment events for scheduling, probe, image or resource failures.
      - Check recent rollout changes without assuming temporal correlation is causal.
      - Page the owning service team through Alertmanager and follow its approved recovery runbook.
