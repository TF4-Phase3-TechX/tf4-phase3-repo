apiVersion: v1
kind: Namespace
metadata:
  name: m22-local
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops
  namespace: m22-local
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops-remediation
  namespace: m22-local
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/status"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-remediation
  namespace: m22-local
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aiops-remediation
subjects:
  - kind: ServiceAccount
    name: aiops
    namespace: m22-local
