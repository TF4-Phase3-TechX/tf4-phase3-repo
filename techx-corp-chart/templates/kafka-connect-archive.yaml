{{- if .Values.kafkaConnectArchive.enabled -}}
{{- $cfg := .Values.kafkaConnectArchive -}}
{{- $name := $cfg.name | default "kafka-connect-orders-archive" -}}
{{- $sa := $cfg.serviceAccount | default dict -}}
{{- $image := $cfg.image | default dict -}}
{{- $repository := required "kafkaConnectArchive.image.repository is required" $image.repository -}}
{{- $tag := required "kafkaConnectArchive.image.tag is required when kafkaConnectArchive.enabled=true" $image.tag -}}
{{- $digest := $image.digest | default "" -}}
{{- $imageRef := printf "%s:%s" $repository $tag -}}
{{- if $digest -}}
{{- $imageRef = printf "%s@%s" $imageRef $digest -}}
{{- end -}}
{{- if $sa.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa.name | default $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/component: kafka-connect
    app.kubernetes.io/part-of: techx-corp
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  {{- with $sa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/component: kafka-connect
    app.kubernetes.io/part-of: techx-corp
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ $cfg.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/component: kafka-connect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/component: kafka-connect
        app.kubernetes.io/part-of: techx-corp
    spec:
      serviceAccountName: {{ $sa.name | default $name }}
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka-connect
          image: {{ $imageRef | quote }}
          imagePullPolicy: {{ $image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: rest
              containerPort: {{ $cfg.restPort }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CONNECT_REST_PORT
              value: {{ $cfg.restPort | quote }}
            - name: CONNECT_REST_ADVERTISED_HOST_NAME
              value: "$(POD_NAME)"
            - name: CONNECT_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: {{ $cfg.kafkaSecret.name }}
                  key: {{ $cfg.kafkaSecret.addressKey }}
            - name: KAFKA_SECURITY_PROTOCOL
              valueFrom:
                secretKeyRef:
                  name: {{ $cfg.kafkaSecret.name }}
                  key: {{ $cfg.kafkaSecret.securityProtocolKey }}
            - name: KAFKA_SASL_MECHANISM
              valueFrom:
                secretKeyRef:
                  name: {{ $cfg.kafkaSecret.name }}
                  key: {{ $cfg.kafkaSecret.saslMechanismKey }}
            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $cfg.kafkaSecret.name }}
                  key: {{ $cfg.kafkaSecret.usernameKey }}
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $cfg.kafkaSecret.name }}
                  key: {{ $cfg.kafkaSecret.passwordKey }}
            - name: CONNECT_SECURITY_PROTOCOL
              value: "$(KAFKA_SECURITY_PROTOCOL)"
            - name: CONNECT_SASL_MECHANISM
              value: "$(KAFKA_SASL_MECHANISM)"
            - name: CONNECT_SASL_JAAS_CONFIG
              value: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="$(KAFKA_USERNAME)" password="$(KAFKA_PASSWORD)";'
            - name: CONNECT_GROUP_ID
              value: {{ $cfg.connect.groupId | quote }}
            - name: CONNECT_CONFIG_STORAGE_TOPIC
              value: {{ $cfg.connect.configStorageTopic | quote }}
            - name: CONNECT_OFFSET_STORAGE_TOPIC
              value: {{ $cfg.connect.offsetStorageTopic | quote }}
            - name: CONNECT_STATUS_STORAGE_TOPIC
              value: {{ $cfg.connect.statusStorageTopic | quote }}
            - name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR
              value: {{ $cfg.connect.replicationFactor | quote }}
            - name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR
              value: {{ $cfg.connect.replicationFactor | quote }}
            - name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR
              value: {{ $cfg.connect.replicationFactor | quote }}
            - name: CONNECT_OFFSET_FLUSH_INTERVAL_MS
              value: {{ $cfg.connect.offsetFlushIntervalMs | quote }}
            - name: CONNECT_KEY_CONVERTER
              value: org.apache.kafka.connect.storage.StringConverter
            - name: CONNECT_VALUE_CONVERTER
              value: org.apache.kafka.connect.json.JsonConverter
            - name: CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: CONNECT_PLUGIN_PATH
              value: /usr/share/java,/usr/share/confluent-hub-components
            - name: KAFKA_HEAP_OPTS
              value: {{ $cfg.heapOpts | quote }}
          readinessProbe:
            httpGet:
              path: /connectors
              port: rest
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: rest
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/component: kafka-connect
    app.kubernetes.io/part-of: techx-corp
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/component: kafka-connect
  ports:
    - name: rest
      port: {{ $cfg.restPort }}
      targetPort: rest
{{- end }}
