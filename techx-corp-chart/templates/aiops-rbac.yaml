{{- if (.Values.components.aiops).enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops-remediation
  labels:
    {{- include "techx-corp.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"{{- if .Values.aiopsRemediation.liveEnabled }}, "patch"{{- end }}]
{{- if .Values.aiopsRemediation.liveEnabled }}
  # AppsV1Api.read_namespaced_deployment_status targets this subresource.
  # Keep it read-only and present only during the signed live-drill window.
  - apiGroups: ["apps"]
    resources: ["deployments/status"]
    verbs: ["get"]
{{- end }}
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-remediation
  labels:
    {{- include "techx-corp.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: aiops
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aiops-remediation
{{- end }}
