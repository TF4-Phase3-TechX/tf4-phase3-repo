name: build-and-push

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional image tag. Default = short SHA.
        required: false
        type: string
      services:
        description: Comma-separated services to build and promote.
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'techx-corp-platform/**'
      - 'techx-corp-chart/**'
      - 'deploy/build-push-images.sh'
      - 'scripts/update_gitops_promotion.py'
      - '.github/workflows/build-and-push.yaml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID || '511825856493' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'techx-corp' }}

jobs:
  changes:
    name: Select images to build
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.services.outputs.services }}
      chart_changed: ${{ steps.services.outputs.chart_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Select affected services
        id: services
        shell: bash
        run: |
          set -euo pipefail
          all=(accounting ad aiops cart checkout currency email fraud-detection frontend frontend-proxy image-provider kafka llm load-generator payment product-catalog product-reviews quote recommendation shipping)
          input='${{ inputs.services }}'

          chart_changed=false
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            services="$(tr ',' '\n' <<< "$input" | sed '/^$/d' | sort -u)"
          else
            base='${{ github.event.before }}'
            head='${{ github.sha }}'
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse "${head}^" 2>/dev/null || true)"
            fi
            changed="$(if [[ -n "$base" ]]; then git diff --name-only "$base" "$head"; else git ls-tree -r --name-only "$head"; fi)"
            if grep -q '^techx-corp-chart/' <<< "$changed"; then
              chart_changed=true
            fi
            services=""
            while IFS= read -r path; do
              [[ -n "$path" ]] || continue
              if [[ "$path" =~ ^techx-corp-platform/src/([^/]+)/ ]]; then
                service="${BASH_REMATCH[1]}"
                if printf '%s\n' "${all[@]}" | grep -Fxq "$service"; then
                  services+="$service"$'\n'
                fi
              fi
            done <<< "$changed"
            services="$(printf '%s' "$services" | sort -u)"
          fi

          unknown="$(comm -23 <(printf '%s\n' "$services" | sed '/^$/d' | sort -u) <(printf '%s\n' "${all[@]}" | sort))"
          [[ -z "$unknown" ]] || { echo "unknown services: $unknown" >&2; exit 1; }
          services_json="$(printf '%s\n' "$services" | sed '/^$/d' | jq -Rsc 'split("\n") | map(select(length > 0))')"
          echo "services=$services_json" >> "$GITHUB_OUTPUT"
          echo "chart_changed=$chart_changed" >> "$GITHUB_OUTPUT"
          echo "Selected services: $services_json"
          echo "Chart changed: $chart_changed"

  build:
    name: Build and push app images
    needs: [changes]
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      image_repository: ${{ steps.vars.outputs.image_repository }}
      image_digests: ${{ steps.digests.outputs.image_digests }}
      source_sha: ${{ github.sha }}
      services: ${{ needs.changes.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Allow Cosign ECR artifact tag updates
        shell: bash
        run: |
          set -euo pipefail
          aws ecr put-image-tag-mutability \
            --repository-name "$ECR_REPOSITORY" \
            --image-tag-mutability IMMUTABLE_WITH_EXCLUSION \
            --image-tag-mutability-exclusion-filters filterType=WILDCARD,filter='sha256-*'

      - name: Set image variables
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          input_tag='${{ inputs.image_tag }}'
          image_tag="${input_tag:-$short_sha}"
          image_repository="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "image_repository=$image_repository" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$image_tag" >> "$GITHUB_ENV"
          echo "IMAGE_REPOSITORY=$image_repository" >> "$GITHUB_ENV"

      - name: Set up QEMU for ARM64 builds
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Create CI env override
        shell: bash
        run: |
          cat > techx-corp-platform/.env.override <<EOF
          IMAGE_NAME=${IMAGE_REPOSITORY}
          IMAGE_VERSION=1.0
          DEMO_VERSION=${IMAGE_TAG}
          EOF

      - name: Prepare currency proto build directory
        working-directory: techx-corp-platform
        run: mkdir -p src/currency/proto

      - name: Build and push selected images
        env:
          SERVICES_JSON: ${{ needs.changes.outputs.services }}
        shell: bash
        run: |
          mapfile -t services < <(jq -r '.[]' <<< "$SERVICES_JSON")
          bash deploy/build-push-images.sh "${services[@]}"

      - name: Verify multi-architecture image indexes
        id: digests
        env:
          SERVICES_JSON: ${{ needs.changes.outputs.services }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f image-manifest-entries.jsonl
          while IFS= read -r service; do
            index_digest="$(aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="${IMAGE_TAG}-${service}" \
              --query 'imageDetails[0].imageDigest' \
              --output text)"
            test -n "$index_digest" && test "$index_digest" != None
            docker buildx imagetools inspect --raw "${IMAGE_REPOSITORY}@${index_digest}" |
              jq -ce --arg service "$service" --arg index_digest "$index_digest" '
                [.manifests[] | select(.platform.os == "linux") | {platform: (.platform.os + "/" + .platform.architecture), digest}]
                | if length != 2 or ([.[].platform] | sort) != ["linux/amd64", "linux/arm64"]
                  then error("OCI index must contain exactly linux/amd64 and linux/arm64")
                  else .
                  end
                | if any(.[]; .digest == null or .digest == "")
                  then error("OCI index has an empty child digest")
                  else .
                  end
                | {key: $service, value: {index_digest: $index_digest, platforms: (map({key: .platform, value: .digest}) | from_entries)}}' \
              >> image-manifest-entries.jsonl
          done < <(jq -r '.[]' <<< "$SERVICES_JSON")
          jq -s 'from_entries' image-manifest-entries.jsonl > image-manifests.json
          jq -r 'to_entries[] | "\(.key)=\(.value.index_digest)"' image-manifests.json | tee image-digests.txt
          digests_json="$(jq -c 'with_entries(.value = .value.index_digest)' image-manifests.json)"
          echo "image_digests=$digests_json" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0

      - name: Security and attestation for image indexes and children
        env:
          SERVICES_JSON: ${{ needs.changes.outputs.services }}
        shell: bash
        run: |
          set -euo pipefail
          TRIVY_VERSION="0.72.0"
          wget -q https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz
          tar -xzf trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz trivy
          sudo mv trivy /usr/local/bin/
          mkdir -p security-artifacts
          echo "0" > security-artifacts/gate_status.txt

          verify_artifact() {
            local image_ref="$1" artifact_id="$2" predicate_file="$3" attempt
            if ! cosign verify \
              --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/.*@refs/heads/main$" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$image_ref" --output text > "security-artifacts/cosign-verify-${artifact_id}.txt" 2>&1; then
              return 1
            fi
            for attempt in 1 2 3 4 5; do
              if cosign verify-attestation \
                --type custom \
                --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/.*@refs/heads/main$" \
                --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                "$image_ref" --output json > "security-artifacts/provenance-verify-${artifact_id}.json" \
                2> "security-artifacts/provenance-verify-${artifact_id}.log" &&
                jq -s -e --slurpfile expected "$predicate_file" '
                  def statements: .[] | if type == "array" then .[] else . end;
                  [statements | .payload | @base64d | fromjson | .predicate
                   | if (.Data? | type) == "string" then (.Data | fromjson) else . end
                   | select(. == $expected[0])] | length > 0
                ' "security-artifacts/provenance-verify-${artifact_id}.json" > /dev/null; then
                return 0
              fi
              sleep $(( attempt * 5 ))
            done
            return 1
          }

          process_child() {
            local service="$1" architecture="$2" digest="$3"
            local platform="linux/${architecture}"
            local artifact_id="${service}-child-${architecture}-${digest//:/-}"
            local image_ref="${IMAGE_REPOSITORY}@${digest}"
            local sbom_file="security-artifacts/sbom-${artifact_id}.json"
            local predicate_file="security-artifacts/delivery-predicate-${artifact_id}.json"
            trivy image --severity HIGH,CRITICAL --format table --output "security-artifacts/trivy-${artifact_id}.txt" "$image_ref" || true
            trivy image --severity HIGH,CRITICAL --format json --output "security-artifacts/trivy-${artifact_id}.json" "$image_ref" || true
            if ! trivy image --severity HIGH,CRITICAL --exit-code 1 "$image_ref" > /dev/null; then
              return 1
            fi
            if ! trivy image --format cyclonedx --output "$sbom_file" "$image_ref"; then
              return 1
            fi
            if ! cosign sign --yes "$image_ref"; then
              return 1
            fi
            if ! jq -n \
              --arg repo "${{ github.repository }}" \
              --arg commit "${{ github.sha }}" \
              --arg workflow "${{ github.workflow }}" \
              --arg run_id "${{ github.run_id }}" \
              --arg service_name "$service" \
              --arg image_digest "$digest" \
              --arg architecture "$platform" \
              --slurpfile sbom "$sbom_file" \
              '{kind: "secure-delivery-evidence", manifest_role: "child", repo: $repo, commit: $commit, workflow: $workflow, run_id: $run_id, service_name: $service_name, image_digest: $image_digest, architecture: $architecture, sbom: {kind: "cyclonedx-sbom", document: $sbom[0]}}' > "$predicate_file"; then
              return 1
            fi
            if ! cosign attest --yes --predicate "$predicate_file" --type custom "$image_ref"; then
              return 1
            fi
            verify_artifact "$image_ref" "$artifact_id" "$predicate_file"
          }

          process_index() {
            local service="$1" digest="$2" child_digests="$3"
            local artifact_id="${service}-index-${digest//:/-}"
            local image_ref="${IMAGE_REPOSITORY}@${digest}"
            local predicate_file="security-artifacts/delivery-predicate-${artifact_id}.json"
            if ! cosign sign --yes "$image_ref"; then
              return 1
            fi
            if ! jq -n \
              --arg repo "${{ github.repository }}" \
              --arg commit "${{ github.sha }}" \
              --arg workflow "${{ github.workflow }}" \
              --arg run_id "${{ github.run_id }}" \
              --arg service_name "$service" \
              --arg image_digest "$digest" \
              --argjson child_digests "$child_digests" \
              '{kind: "secure-delivery-evidence", manifest_role: "index", repo: $repo, commit: $commit, workflow: $workflow, run_id: $run_id, service_name: $service_name, image_digest: $image_digest, child_digests: $child_digests}' > "$predicate_file"; then
              return 1
            fi
            if ! cosign attest --yes --predicate "$predicate_file" --type custom "$image_ref"; then
              return 1
            fi
            verify_artifact "$image_ref" "$artifact_id" "$predicate_file"
          }

          while IFS= read -r service; do
            index_digest="$(jq -er --arg service "$service" '.[$service].index_digest' image-manifests.json)"
            child_digests="$(jq -ce --arg service "$service" '.[$service].platforms' image-manifests.json)"
            for architecture in amd64 arm64; do
              digest="$(jq -er --arg architecture "linux/${architecture}" '.[$architecture]' <<< "$child_digests")"
              if ! process_child "$service" "$architecture" "$digest"; then
                echo "::error::Security processing failed for ${service} linux/${architecture}"
                echo "1" > security-artifacts/gate_status.txt
              fi
            done
            if ! process_index "$service" "$index_digest" "$child_digests"; then
              echo "::error::Security processing failed for ${service} image index"
              echo "1" > security-artifacts/gate_status.txt
            fi
          done < <(jq -r '.[]' <<< "$SERVICES_JSON")

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-artifacts-${{ steps.vars.outputs.image_tag }}
          path: security-artifacts/
          if-no-files-found: ignore

      - name: Enforce security gate results
        run: |
          if [ -f security-artifacts/gate_status.txt ] && [ "$(cat security-artifacts/gate_status.txt)" = "1" ]; then
            echo "Security gate failed: One or more steps failed."
            exit 1
          fi

      - name: Write build metadata
        env:
          SERVICES_JSON: ${{ needs.changes.outputs.services }}
        shell: bash
        run: |
          jq -n \
            --arg image_repository "$IMAGE_REPOSITORY" \
            --arg image_tag "$IMAGE_TAG" \
            --arg git_sha "$GITHUB_SHA" \
            --argjson services "$SERVICES_JSON" \
            --slurpfile manifests image-manifests.json \
            '{
              image_repository: $image_repository,
              image_tag: $image_tag,
              git_sha: $git_sha,
              services: $services,
              service_images: ($services | map({
                service: .,
                tag: ($image_tag + "-" + .),
                digest: $manifests[0][.].index_digest,
                platform_digests: $manifests[0][.].platforms
              }))
            }' > build-metadata.json

      - name: Upload build metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-metadata-${{ steps.vars.outputs.image_tag }}
          path: |
            build-metadata.json
            image-digests.txt
            image-manifests.json
          if-no-files-found: error

  promote:
    name: Open GitOps promotion PR
    needs: [changes, build]
    if: >-
      always() &&
      (needs.build.result == 'success' ||
      (needs.changes.outputs.chart_changed == 'true' && needs.changes.outputs.services == '[]'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.GITOPS_PROMOTION_APP_ID }}
          private-key: ${{ secrets.GITOPS_PROMOTION_APP_PRIVATE_KEY }}
          owner: TF4-Phase3-TechX
          repositories: tf4-phase3-gitops-manifests

      - name: Checkout source repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Checkout GitOps repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: TF4-Phase3-TechX/tf4-phase3-gitops-manifests
          token: ${{ steps.app-token.outputs.token }}
          path: gitops

      - name: Update GitOps revisions
        id: promotion-branch
        env:
          CHART_CHANGED: ${{ needs.changes.outputs.chart_changed }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IMAGE_DIGESTS_JSON: ${{ needs.build.outputs.image_digests }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          SERVICES_JSON: ${{ needs.changes.outputs.services }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch="promotion/production"
          open_prs="$(gh pr list --repo TF4-Phase3-TechX/tf4-phase3-gitops-manifests --head "$branch" --base main --state open --limit 2 --json number)"
          open_count="$(jq 'length' <<< "$open_prs")"
          [[ "$open_count" -le 1 ]] || { echo "expected at most one open promotion PR" >&2; exit 1; }
          open_pr="$(jq -r '.[0].number // empty' <<< "$open_prs")"

          cd gitops
          git config user.name "techx-tf4-gitops-promotion"
          git config user.email "techx-tf4-gitops-promotion@users.noreply.github.com"
          if [[ -n "$open_pr" ]]; then
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git show-ref --verify --quiet "refs/remotes/origin/$branch" || { echo "open promotion PR #$open_pr has no branch" >&2; exit 1; }
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout -B "$branch" origin/main
          fi
          printf 'open_pr=%s\n' "$open_pr" >> "$GITHUB_OUTPUT"
          cd ..
          image_digests_json="$IMAGE_DIGESTS_JSON"
          args=(
            --gitops-dir gitops
            --services-json "$SERVICES_JSON"
            --image-digests-json "$image_digests_json"
            --image-tag "$IMAGE_TAG"
            --source-sha "$SOURCE_SHA"
          )
          [[ "$CHART_CHANGED" == 'true' ]] && args+=(--chart-changed)
          python scripts/update_gitops_promotion.py "${args[@]}"
          git -C gitops diff --check

      - name: Create or update promotion PR
        env:
          CHART_CHANGED: ${{ needs.changes.outputs.chart_changed }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IMAGE_DIGESTS_JSON: ${{ needs.build.outputs.image_digests }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          OPEN_PR: ${{ steps.promotion-branch.outputs.open_pr }}
          SERVICES_JSON: ${{ needs.changes.outputs.services }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch="promotion/production"
          cd gitops
          if git diff --quiet; then
            exit 0
          fi
          git add environments/production/image-revisions.yaml argocd/root-resources/applications.yaml
          git commit -m "chore(gitops): promote ${SOURCE_SHA::7}"
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            expected_tip="$(git rev-parse "origin/$branch")"
            git push --force-with-lease="$branch:$expected_tip" origin "$branch"
          else
            git push --force-with-lease="$branch:" origin "$branch"
          fi
          services="$(jq -r '.[]' <<< "$SERVICES_JSON" | paste -sd, -)"
          image_digests_json="$IMAGE_DIGESTS_JSON"
          section="### Promotion \`${SOURCE_SHA::7}\`"$'\n\n'"Source commit: \`${SOURCE_SHA}\`"
          if [[ "$SERVICES_JSON" != '[]' ]]; then
            section+=$'\n\n'"Image tag: \`${IMAGE_TAG}\`"$'\n\n'"Services: \`${services}\`"
            section+=$'\n\n'"Promoted image digests:"$'\n'
            while IFS='=' read -r service digest; do
              [[ -n "$service" && -n "$digest" ]] || continue
              section+=$'\n'"- \`${service}\`: \`${digest}\`"
            done < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' <<< "$image_digests_json")
          fi
          if [[ "$CHART_CHANGED" == 'true' ]]; then
            section+=$'\n\n'"Chart source SHA: \`${SOURCE_SHA}\` (techx-corp and techx-observability)"
          fi
          if [[ -n "$OPEN_PR" ]]; then
            body="$(gh pr view "$OPEN_PR" --repo TF4-Phase3-TechX/tf4-phase3-gitops-manifests --json body --jq '.body')"$'\n\n---\n\n'"$section"
            gh pr edit "$OPEN_PR" --repo TF4-Phase3-TechX/tf4-phase3-gitops-manifests --title "chore(gitops): promote ${SOURCE_SHA::7}" --body "$body"
          else
            body="$section"$'\n\n---\n\nReview and merge to let Argo CD deploy this release.'
            gh pr create --base main --head "$branch" --title "chore(gitops): promote ${SOURCE_SHA::7}" --body "$body"
          fi
